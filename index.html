<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLOW - Monitoramento</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f8fb;
            color: #1f2937;
        }

        #loginTela {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            background: white;
            width: 100%;
            max-width: 380px;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
            text-align: center;
        }

        .login-box h1 {
            color: #0f4c81;
            font-size: 42px;
            margin-bottom: 8px;
        }

        .login-box p {
            color: #6b7280;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #0f4c81;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0c3d68;
        }

        #mensagem {
            margin-top: 15px;
            color: #dc2626;
            font-size: 14px;
        }

        #painel {
            display: none;
        }

        header {
            background: #0f4c81;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        header h1 {
            font-size: 42px;
            margin-bottom: 8px;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .status-bar {
            background: white;
            padding: 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 25px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 22px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
        }

        .card h2 {
            font-size: 18px;
            color: #4b5563;
            margin-bottom: 18px;
        }

        .valor {
            font-size: 38px;
            font-weight: bold;
            color: #0f4c81;
        }

        .unidade {
            color: #6b7280;
        }

        @media (max-width: 600px) {
            .status-bar {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div id="loginTela">
        <div class="login-box">
            <h1>FLOW</h1>
            <p>Acesso ao sistema de monitoramento</p>

            <input
                type="password"
                id="senha"
                placeholder="Digite a senha"
            >

            <button onclick="entrar()">Entrar</button>

            <div id="mensagem"></div>
        </div>
    </div>

    <div id="painel">

        <header>
            <h1>FLOW</h1>
            <p>Plataforma de Monitoramento da Qualidade da Água</p>
        </header>

        <main class="container">

            <div class="status-bar">
                <div>
                    <strong>Status:</strong>
                    <span id="status">Aguardando dados</span>
                </div>

                <div>
                    Última atualização:
                    <strong id="ultimaAtualizacao">--</strong>
                </div>
            </div>

            <div class="cards">

                <div class="card">
                    <h2>Turbidez</h2>
                    <span id="turbidez" class="valor">--</span>
                    <span class="unidade">NTU</span>
                </div>

                <div class="card">
                    <h2>Condutividade Elétrica</h2>
                    <span id="condutividade" class="valor">--</span>
                    <span class="unidade">µS/cm</span>
                </div>

            </div>

        </main>

    </div>

    <script>
        async function entrar() {
            const senha = document.getElementById("senha").value;
            const mensagem = document.getElementById("mensagem");

            mensagem.textContent = "Verificando...";

            try {
                const resposta = await fetch("/api/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ senha })
                });

                if (resposta.ok) {
                    document.getElementById("loginTela").style.display = "none";
                    document.getElementById("painel").style.display = "block";
                    mensagem.textContent = "";
                } else {
                    mensagem.textContent = "Senha incorreta.";
                }

            } catch (erro) {
                mensagem.textContent = "Erro ao verificar a senha.";
            }
        }

        document.getElementById("senha").addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                entrar();
            }
        });
    </script>

</body>
</html>
